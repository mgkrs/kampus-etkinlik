<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2321032043.css">
</head>
<body>

    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> &middot;
            <a href="etkinlikler.html">Etkinlikler</a> &middot;
            <a href="etkinlik-ekle.html">Ekle</a> &middot; 
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form>
            <div class="form-grup">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" required>
            </div>

            <div class="form-grup">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz &blacktriangledown;</option>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>

            <div class="form-grup">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" required>
            </div>

            <div class="form-grup">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4" required></textarea>
            </div>

            <button type="submit">Kaydet</button>
        </form>
    </main>

    <footer>
        <p>&copy; Muhammet Gazi Kuruş &middot; 2026</p>
    </footer>

</body>
</html>
