<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Ekle</title>
</head>
<body>

    <h1 align="center">Etkinlik Ekle</h1>

    <center>
        <nav>
            <a href="index.html">Ana Sayfa</a> |
            <a href="etkinlik-ekle.html">Ekle</a> | 
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </center>
    <br><br>

    <table border="1" align="center" cellpadding="15">
        <tr>
            <td>
                <form>
                    <label for="ad">Etkinlik Adı</label><br>
                    <input type="text" id="ad" name="ad" required><br><br>

                    <label for="kategori">Kategori</label><br>
                    <select id="kategori" name="kategori" required>
                        <option value="">Seçiniz...</option>
                        <option value="seminer">Seminer</option>
                        <option value="atolye">Atölye</option>
                        <option value="sempozyum">Sempozyum</option>
                    </select><br><br>

                    <label for="tarih">Tarih</label><br>
                    <input type="date" id="tarih" name="tarih" required><br><br>

                    <label for="aciklama">Açıklama</label><br>
                    <textarea id="aciklama" name="aciklama" rows="4" cols="25" required></textarea><br><br>

                    <button type="submit">Kaydet</button>
                </form>
            </td>
        </tr>
    </table>

    <br><br><br><br><br><br><br><br><br>
